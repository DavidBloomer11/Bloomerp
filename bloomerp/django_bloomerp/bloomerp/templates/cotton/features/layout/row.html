<div
    class="workspace-row"
    data-layout-row
    data-row-title="{{ row.title|default:'' }}"
    data-row-columns="{{ row.columns }}"
>
    <div class="workspace-row__header workspace-row__header--static" data-row-header>
        <span class="workspace-row__title{% if not row.title %} workspace-row__title--empty{% endif %}" data-row-title-display>{{ row.title|default:' ' }}</span>

        <div class="workspace-row__controls" data-row-controls>
            <input type="text" class="input input-sm min-w-32" data-row-title-input value="{{ row.title|default:'' }}" placeholder="Row title" />
            <input type="number" min="1" max="12" value="{{ row.columns }}" class="workspace-row__input" data-row-cols-input />
            <button type="button" class="workspace-row__add" data-add-row title="Add row below">
                <i class="fa fa-plus"></i>
            </button>
            <button type="button" class="workspace-row__drag" data-row-drag-handle title="Drag row">
                <i class="fa fa-grip-vertical"></i>
            </button>
            <button type="button" class="workspace-row__remove" data-remove-row title="Remove row">
                <i class="fa fa-xmark"></i>
            </button>
        </div>
    </div>

    <div class="workspace-row__grid" data-layout-grid style="grid-template-columns: repeat({{ row.columns }}, minmax(0, 1fr));">
        {% for item in row.items %}
            <c-features.layout.item 
                :item="item"
            />
        {% endfor %}
    </div>
</div>
