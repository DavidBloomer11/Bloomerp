<c-ui.dropdown.body
    trigger_text="{{ selected_preference_name|default:'Preference' }}"
    trigger_icon_class="fa fa-bookmark"
    trigger_button_class="btn-secondary"
    trigger_class="w-full justify-center gap-2 sm:w-auto"
    wrapper_class="w-full sm:w-auto"
    position="right"
    size="sm"
    width="w-80"
    fixed=True
    menu_class="max-h-[calc(100vh-6rem)] max-w-[calc(100vw-1rem)] overflow-auto"
>
    <div
        id="select-preference-dropdown-{{ model }}"
        hx-get="{% url 'components_select_preference' model=model%}?{% if args %}{% for key, value in args.items %}{{ key }}={{ value }}&{% endfor %}{% endif %}"
        hx-trigger="revealed once"
        hx-target="this"
        hx-swap="innerHTML"
        hx-push-url="false"
    >
        <div class="px-4 py-3 text-sm text-gray-500">
            Loading preferences...
        </div>
    </div>
</c-ui.dropdown.body>
