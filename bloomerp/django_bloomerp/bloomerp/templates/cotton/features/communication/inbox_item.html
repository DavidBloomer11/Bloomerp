<div 
    bloomerp-component="inbox-item"
    data-inbox-item-id="{{ item.id }}"
    >
    <button class="w-full border-b border-gray-200 p-2 text-left hover:bg-gray-50">
        <div class="flex items-center gap-4">
            <span class="mt-0.5 inline-flex size-5 items-center justify-center rounded-md bg-primary-500 text-[0.7rem] text-white">
                <i class="{{ item.icon }}"></i>
            </span>
            <span class="min-w-0 flex-1">
                <span class="flex flex-col">
                    <span class="{% if not item.is_read %} font-bold {% endif %}">{{ item.actor }}</span>
                    <div class="flex items-center justify-between gap-4">
                        <span class="truncate text-sm {% if not item.is_read %}font-bold{% endif %}"><c-i18n.blocktrans>{{ item.title }}</c-i18n.blocktrans></span>
                        <span class="text-sm text-gray-600"><c-i18n.blocktrans>{{ item.datetime_received }}</c-i18n.blocktrans></span>
                    </div>
                </span>
                {% if item.snippet %}
                <span class="mt-3 flex items-center gap-2 text-sm text-gray-600">
                    <span class="truncate"><c-i18n.blocktrans>{{ item.snippet }}</c-i18n.blocktrans></span>
                </span>
                {% endif %}
            </span>
        </div>
    </button>
</div>
