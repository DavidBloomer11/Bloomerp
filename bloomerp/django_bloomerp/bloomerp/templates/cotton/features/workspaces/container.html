<c-features.layout.container 
    :component_name="ts_container_component"
    :layout="layout"
    :can_change="can_change"
    :change_context="change_context"
    :init_edit="init_edit"
    :extra_attrs="layout_container_extra_attrs"
    >
    <c-slot name="buttons_left">
        <!--Filters-->
        <div class="w-full sm:w-auto">
            <c-ui.shortcut_tooltip 
                position="bottom" 
                shortcut="mod+1"
                focus_target="select"
                >
                <c-ui.dropdown.body 
                    trigger_text="Filter"
                    trigger_icon_class="fa fa-filter"
                    trigger_button_class="btn-secondary"
                    trigger_class="w-full justify-center gap-2"
                    wrapper_class="w-full"
                    size="sm"
                    width="w-128"
                    position="left"
                    >
                    <div class="p-3">
                        <div>
                            <div class="mb-2">
                                <c-ui.text.subtitle class="mb-2">
                                    Filter
                                </c-ui.text.subtitle>
                                
                                <div
                                    id="workspace-filter-section-{{ workspace.id }}"
                                    hx-get="{% url 'components_workspaces_filters_init' workspace_id=workspace.id %}"
                                    hx-trigger="load"
                                    hx-target="this"
                                    hx-swap="innerHTML"
                                >
                                    <div class="px-3 py-2 text-sm text-slate-500">
                                        <c-i18n.blocktrans>Loading filters...</c-i18n.blocktrans>
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="btn btn-primary btn-sm" data-workspace-apply-filters>
                                Apply Filters
                            </button>
                        </div>
                    </div>
                </c-ui.dropdown.body>
            </c-ui.shortcut_tooltip>
        </div>
        <!--End filters-->
    </c-slot>
    
    <c-slot name="buttons_right">
        {% if show_module_selector %}
            <button
                type="button"
                class="btn btn-secondary btn-sm"
                hx-get="{% url 'bloomerp_home_view' %}?modules=1"
                hx-target="#main-content"
                hx-push-url="true"
                hx-swap="innerHTML"
            >
                <i class="fa-solid fa-grid-2"></i>
                <c-i18n.blocktrans>Select module</c-i18n.blocktrans>
            </button>
        {% endif %}

        <c-ui.shortcut_tooltip position="bottom" shortcut="mod+6">
            <c-features.preferences.select_preference_button
                model="Workspace"
                :args="{
                    'module_id': '{{ module_id }}',
                }"
                selected_preference_name="{{ workspace.name }}"
            />
        </c-ui.shortcut_tooltip>

        <button 
            class="btn btn-secondary btn-sm hidden"
            data-create-tile-btn
            >
            <i class="fa fa-add"></i>
            <c-i18n.blocktrans>Create tile</c-i18n.blocktrans>
        </button>
    </c-slot>
</c-features.layout.container>
