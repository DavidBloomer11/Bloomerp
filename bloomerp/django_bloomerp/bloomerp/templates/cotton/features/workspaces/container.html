<c-features.sectioned_layouts.container 
    component_name="workspace-container" 
    :layout="workspace.layout_obj"
    :layout_object_id="workspace.id"
    :layout_object_content_type_id="{{ workspace_content_type_id.id }}"
    :can_edit="True"
    :can_delete="True"
    :extra_attrs="extra_attrs"
    :preference_object="workspace"
    >
    <c-slot name="buttons_left">
    
        <!--Filters-->
        <div class="w-full sm:w-auto">
            <c-ui.shortcut_tooltip 
                position="bottom" 
                shortcut="mod+1"
                focus_target="select"
                >
                <c-ui.dropdown.body 
                    trigger_text="Filter"
                    trigger_icon_class="fa fa-filter"
                    trigger_button_class="btn-secondary"
                    trigger_class="w-full justify-center gap-2"
                    wrapper_class="w-full"
                    size="sm"
                    width="w-128"
                    position="left"
                    >
                    <div class="p-3">
                        <div>
                            <div class="mb-2">
                                <c-ui.text.subtitle class="mb-2">
                                    Filter
                                </c-ui.text.subtitle>
                                
                                <div
                                    id="workspace-filter-section-{{ workspace.id }}"
                                    hx-get="{% url 'components_workspaces_filters_init' workspace_id=workspace.id %}"
                                    hx-trigger="load"
                                    hx-target="this"
                                    hx-swap="innerHTML"
                                >
                                    <div class="px-3 py-2 text-sm text-slate-500">
                                        <c-i18n.blocktrans>Loading filters...</c-i18n.blocktrans>
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="btn btn-primary btn-sm" data-workspace-apply-filters>
                                Apply Filters
                            </button>
                        </div>
                    </div>
                </c-ui.dropdown.body>
            </c-ui.shortcut_tooltip>
        </div>
        <!--End filters-->
    </c-slot>
    
    <c-slot name="buttons_right">
        <c-ui.shortcut_tooltip position="bottom" shortcut="mod+6">
            <c-features.preferences.select_preference_button
                model="Workspace"
                :args="{
                    'module_id': '{{ module_id }}',
                }"
                selected_preference_name="{{ workspace.name }}"
            />
        </c-ui.shortcut_tooltip>

        <button 
            class="btn btn-secondary btn-sm hidden"
            data-create-tile-btn
            >
            <i class="fa fa-add"></i>
            <c-i18n.blocktrans>Create tile</c-i18n.blocktrans>
        </button>
    </c-slot>
</c-features.sectioned_layouts.container>
