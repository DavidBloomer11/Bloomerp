<c-ui.inputs.selectable_cards.container
    name="provider"
    :include_search="False"
    :allow_multiple="False"
    value="{{ selected_provider }}"
>
    {% for provider in providers %}
        <c-ui.inputs.selectable_cards.item
            value="{{ provider.key }}"
            icon="{{ provider.icon }}"
            name="{{ provider.name }}"
            description="{{ provider.description }}"
        />
    {% endfor %}
</c-ui.inputs.selectable_cards.container>
