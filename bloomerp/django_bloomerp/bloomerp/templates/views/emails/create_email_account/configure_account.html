{% load crispy_forms_tags %}

<div class="space-y-4">
    <div class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
        <c-ui.text.subtitle>{{ provider_label }}</c-ui.text.subtitle>
        {% if provider_definition.setup_instructions %}
            <div class="mt-3">
                {{ provider_definition.setup_instructions|safe }}
            </div>
        {% endif %}
    </div>

    {{ form|crispy }}
</div>
