id: customer_invoice
name: Customer Invoice
description: Customer invoice tracked in accounts receivable
name_plural: Customer Invoices
string_representation: "{invoice_number} - {customer}"
fields:
  - id: invoice_number
    name: Invoice Number
    type: CharField
    options:
      max_length: 30
      unique: true
  - id: customer
    name: Customer
    type: ForeignKey
    options:
      to: finance.accounts_receivable.customer
      on_delete: call(django.db.models.PROTECT)
  - id: journal_entry
    name: Journal Entry
    type: ForeignKey
    options:
      to: finance.general_ledger.journal_entry
      null: true
      blank: true
      on_delete: call(django.db.models.SET_NULL)
  - id: invoice_date
    name: Invoice Date
    type: DateField
  - id: due_date
    name: Due Date
    type: DateField
  - id: currency
    name: Currency
    type: CharField
    options:
      max_length: 10
      default: USD
  - id: exchange_rate
    name: Exchange Rate
    type: DecimalField
    options:
      max_digits: 15
      decimal_places: 6
      default: 1
  - id: subtotal
    name: Subtotal
    type: DecimalField
    options:
      max_digits: 15
      decimal_places: 2
      default: 0
  - id: tax_amount
    name: Tax Amount
    type: DecimalField
    options:
      max_digits: 15
      decimal_places: 2
      default: 0
  - id: total_amount
    name: Total Amount
    type: DecimalField
    options:
      max_digits: 15
      decimal_places: 2
      default: 0
  - id: paid_amount
    name: Paid Amount
    type: DecimalField
    options:
      max_digits: 15
      decimal_places: 2
      default: 0
  - id: outstanding_amount
    name: Outstanding Amount
    type: DecimalField
    options:
      max_digits: 15
      decimal_places: 2
      default: 0
  - id: status
    name: Status
    type: ChoiceField
    options:
      choices:
        - ["DRAFT", "Draft"]
        - ["POSTED", "Posted"]
        - ["PARTIALLY_PAID", "Partially Paid"]
        - ["PAID", "Paid"]
        - ["OVERDUE", "Overdue"]
        - ["CANCELLED", "Cancelled"]
  - id: sales_order_number
    name: Sales Order Number
    type: CharField
    options:
      max_length: 30
      null: true
      blank: true
  - id: customer_reference
    name: Customer Reference
    type: CharField
    options:
      max_length: 50
      null: true
      blank: true
  - id: notes
    name: Notes
    type: TextField
    options:
      null: true
      blank: true
