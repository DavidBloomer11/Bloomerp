id: vendor_payment
name: Vendor Payment
description: Payment made to a vendor from a bank account
name_plural: Vendor Payments
string_representation: "{payment_number} - {vendor}"
fields:
  - id: payment_number
    name: Payment Number
    type: CharField
    options:
      max_length: 30
      unique: true
  - id: vendor
    name: Vendor
    type: ForeignKey
    options:
      to: finance.accounts_payable.vendor
      on_delete: call(django.db.models.PROTECT)
  - id: bank_account
    name: Bank Account
    type: ForeignKey
    options:
      to: finance.treasury.bank_account
      on_delete: call(django.db.models.PROTECT)
  - id: journal_entry
    name: Journal Entry
    type: ForeignKey
    options:
      to: finance.general_ledger.journal_entry
      null: true
      blank: true
      on_delete: call(django.db.models.SET_NULL)
  - id: payment_date
    name: Payment Date
    type: DateField
  - id: amount
    name: Amount
    type: DecimalField
    options:
      max_digits: 15
      decimal_places: 2
      default: 0
  - id: currency
    name: Currency
    type: CharField
    options:
      max_length: 10
      default: USD
  - id: payment_method
    name: Payment Method
    type: ChoiceField
    options:
      choices:
        - ["ACH", "ACH"]
        - ["WIRE", "Wire"]
        - ["CARD", "Card"]
        - ["CHECK", "Check"]
  - id: reference_number
    name: Reference Number
    type: CharField
    options:
      max_length: 50
      null: true
      blank: true
  - id: status
    name: Status
    type: ChoiceField
    options:
      choices:
        - ["SCHEDULED", "Scheduled"]
        - ["PAID", "Paid"]
        - ["VOIDED", "Voided"]
  - id: notes
    name: Notes
    type: TextField
    options:
      null: true
      blank: true
