name: Bank Account
id: bank_account
description: Stores bank account information
name_plural: Bank Accounts
string_representation: "{bank_name} - {account_number}"
fields:
  - id: bank_name
    name: Bank Name
    type: CharField
    options:
      max_length: 150
  - id: account_name
    name: Account Name
    type: CharField
    options:
      max_length: 150
  - id: account_number
    name: Account Number
    type: CharField
    options:
      max_length: 50
  - id: account_type
    name: Account Type
    type: ChoiceField
    options:
      choices:
        - ["checking", "Checking"]
        - ["savings", "Savings"]
        - ["credit", "Credit"]
  - id: currency
    name: Currency
    type: CharField
    options:
      max_length: 10
      default: USD
  - id: opening_balance
    name: Opening Balance
    description: Balance at the start of the current fiscal year
    type: DecimalField
    options:
      max_digits: 15
      decimal_places: 2
      default: 0
  - id: last_reconciled_date
    name: Last Reconciled Date
    type: DateField
    options:
      null: true
      blank: true
  - id: last_reconciled_balance
    name: Last Reconciled Balance
    type: DecimalField
    options:
      max_digits: 15
      decimal_places: 2
      default: 0
  - id: is_primary
    name: Primary Account
    type: BooleanField
    options:
      default: false
  - id: iban
    name: IBAN
    type: CharField
    options:
      max_length: 34
      null: true
      blank: true
  - id: swift_code
    name: SWIFT Code
    type: CharField
    options:
      max_length: 20
      null: true
      blank: true
  - id: branch
    name: Branch
    type: CharField
    options:
      max_length: 120
      null: true
      blank: true
  - id: is_active
    name: Is Active
    type: BooleanField
    options:
      default: true
  - id: notes
    name: Notes
    type: TextField
    options:
      null: true
      blank: true
field_layout:
  rows:
    - title: "Account Details"
      columns: 2
      items:
        - id: bank_name
        - id: account_name
        - id: account_number
        - id: account_type
        - id: currency
    - title: "Identifiers"
      columns: 2
      items:
        - id: iban
        - id: swift_code
        - id: branch
    - title: "Status"
      columns: 1
      items:
        - id: is_active
